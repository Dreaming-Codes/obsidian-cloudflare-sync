name = "cloudflare-sync"
main = "build/index.js"
compatibility_date = "2025-12-30"

[build]
command = "cargo install -q worker-build@^0.7 && worker-build --release"

[[r2_buckets]]
binding = "VAULT_STORAGE"
bucket_name = "obsidian-vault-storage"

[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDurableObject"

[[durable_objects.bindings]]
name = "SYNC_NOTIFY_DO"
class_name = "SyncNotifyDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDurableObject"]
new_classes = ["SyncNotifyDurableObject"]

[vars]
BASE_URL = "https://sync.elysiumcraftrp.org"

# Secrets (set via `wrangler secret put`):
# - RESEND_API_KEY
# - JWT_SECRET
