[package]
name = "cloudflare-sync-worker"
version = "0.1.0"
edition = "2024"
authors = ["DreamingCodes <me@dreaming.codes>"]

[lib]
crate-type = ["cdylib"]

# Aggressive release optimization for minimal WASM size
[profile.release]
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
codegen-units = 1
overflow-checks = false

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde", "wasmbind"] }
futures = "0.3.31"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4.3"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
urlencoding = "2.1.3"
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
worker = "0.7.4"
worker-macros = "0.7.4"
yrs = "0.21"
