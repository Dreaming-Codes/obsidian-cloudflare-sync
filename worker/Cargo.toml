[package]
name = "cloudflare-sync-worker"
version = "0.1.0"
edition = "2024"
authors = ["DreamingCodes <me@dreaming.codes>"]

[lib]
crate-type = ["cdylib"]

# Aggressive release optimization for minimal WASM size
[profile.release]
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
codegen-units = 1
overflow-checks = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
worker = "0.7.4"
worker-macros = "0.7.4"
